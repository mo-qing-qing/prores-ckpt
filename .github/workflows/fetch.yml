# =============================================================================
# ProRes 权重代下工作流  （v2）
#
# v2 修了什么：v1 用 `gdown --id xxx`，但新版 gdown 已删除 --id 参数，
#   文件 id 改成位置参数，于是四次尝试全在参数解析阶段就退出，
#   日志报 "gdown: error: unrecognized arguments: --id"。
#   v2 改成 `gdown <id> -O out.pth`，并加了一条直链兜底。
#
# 更新方法（仓库里已经有这个文件了，不用新建）：
#   1. 打开 https://github.com/mo-qing-qing/prores-ckpt/blob/main/.github/workflows/fetch.yml
#   2. 点右上角铅笔图标进入编辑
#   3. 编辑器里 Ctrl+A 全选，Delete 清空
#   4. 复制本文件全部内容，粘贴进去
#   5. 右上角 Commit changes -> 弹窗里再点 Commit changes
#   6. 回到 Actions -> fetch-prores-ckpt -> Run workflow -> 绿色按钮
#
# 粘贴前请确认浏览器的翻译插件是关闭状态（v1 提交失败就是翻译插件造成的）。
# 本文件的中文说明全部是 # 注释，整段复制不影响运行。
# =============================================================================

name: fetch-prores-ckpt

# Purpose: this machine cannot reach Google Drive at all (TCP-level block,
# verified with --resolve against real IPs). GitHub runners run outside the
# firewall, so let a runner download the Drive file, split it into chunks,
# and publish the chunks as Release assets. Then download from Release.

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive file id (default is the ProRes ViT-L checkpoint)"
        required: false
        default: "1P-MGgYtXJR214rBCD_LNZYrfQwDbSWGJ"
      part_mb:
        description: "chunk size in MB (GitHub allows 2GB per Release asset)"
        required: false
        default: "700"

permissions:
  contents: write   # a fresh repo token is read-only by default; Release needs write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install gdown
        run: pip install --quiet --upgrade gdown

      - name: Download from Google Drive
        run: |
          FID="${{ inputs.file_id }}"
          echo "gdown version:"; gdown --version || true
          # NOTE: recent gdown removed --id; the file id is a positional argument now.
          ok=0
          for i in 1 2 3; do
            echo "=== gdown attempt $i ==="
            if gdown "$FID" -O ckpt_raw.pth --continue --retries 5; then
              ok=1
              break
            fi
            sleep 10
          done
          SIZE=0
          if [ -f ckpt_raw.pth ]; then SIZE=$(stat -c%s ckpt_raw.pth); fi
          echo "after gdown: ok=$ok size=$SIZE"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "=== fallback: direct usercontent link ==="
            rm -f ckpt_alt.pth
            curl -L -sS --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" \
              -o ckpt_alt.pth -w "http=%{http_code}\n" || true
            if [ -f ckpt_alt.pth ]; then
              ASIZE=$(stat -c%s ckpt_alt.pth)
              echo "fallback size=$ASIZE"
              if [ "$ASIZE" -gt 100000000 ]; then
                mv ckpt_alt.pth ckpt_raw.pth
                SIZE=$ASIZE
              else
                echo "fallback head:"; head -c 400 ckpt_alt.pth; echo
              fi
            fi
          fi

          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::both gdown and direct link failed, final size=$SIZE. See the log above for the exact error."
            exit 1
          fi
          MD5=$(md5sum ckpt_raw.pth | awk '{print $1}')
          echo "SIZE_BYTES=$SIZE" >> "$GITHUB_ENV"
          echo "RAW_MD5=$MD5" >> "$GITHUB_ENV"
          echo "downloaded $SIZE bytes, md5=$MD5"

      - name: Verify it is a torch archive
        run: |
          python -c "import zipfile,sys; ok=zipfile.is_zipfile('ckpt_raw.pth'); print('is_zipfile',ok); sys.exit(0 if ok else 1)"

      - name: Split into chunks
        run: |
          split -b "${{ inputs.part_mb }}M" -d -a 2 ckpt_raw.pth ckpt.pth.part
          ls -lh ckpt.pth.part*
          md5sum ckpt.pth.part* | tee parts_md5.txt

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ckpt-${{ github.run_number }}
          name: ProRes checkpoint run ${{ github.run_number }}
          body: |
            raw size : ${{ env.SIZE_BYTES }} bytes
            raw md5  : ${{ env.RAW_MD5 }}
            merge    : cat ckpt.pth.part* > checkpoint-49.pth
          files: |
            ckpt.pth.part*
            parts_md5.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =============================================================================
# 跑完之后
#
#   Release 页面出现 ckpt.pth.part00 / part01 / part02（1.5G 分三卷）
#   直连慢就拼加速前缀（实测可用）：
#       https://ghfast.top/ + 原来的完整链接
#   三个文件全部丢进：
#       E:\lunwen\图像复原\11_统一复原专题\03_代码\ProRes-main\ProRes\_ckpt_parts\
#   然后 cd ProRes && python join_ckpt.py
#
# 这次的日志怎么看
#   正常应该是：
#       gdown version: 5.x.x
#       === gdown attempt 1 ===
#       ... Downloading ...
#       after gdown: ok=1 size=1500000000 左右
#   如果看到 "fallback: direct usercontent link"，说明 gdown 还是不行、
#   走了兜底直链，只要 fallback size 足够大也算成功。
#
#   如果两条都失败，现在会直接 exit 1 并打印真实错误，
#   不会再拿"配额"这种猜的文案误导。
# =============================================================================
