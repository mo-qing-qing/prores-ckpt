# =============================================================================
# ProRes 权重代下工作流  （v3）
#
# 版本历史
#   v1  gdown --id 报错（新版 gdown 删了这个参数）
#   v2  改成位置参数 gdown <id>，跑通了。但发现官方 checkpoint 有 4.45 GB，
#       因为里面除了 model 权重还存了 optimizer / lr_scheduler，
#       而推理只需要 checkpoint['model']（约 1.4 GB）。
#   v3  增加一步自动瘦身：只导出 {'model': state_dict}，让你少下 3 GB。
#       若识别不出结构，会自动退回原始完整文件，不会失败。
#
# 更新方法（仓库里已有该文件，不用新建）
#   1. 打开 https://github.com/mo-qing-qing/prores-ckpt/blob/main/.github/workflows/fetch.yml
#   2. 点右上角铅笔图标
#   3. Ctrl+A 全选，Delete 清空
#   4. 复制本文件全部内容，粘贴
#   5. 右上角 Commit changes -> 弹窗里再点 Commit changes
#   6. Actions -> fetch-prores-ckpt -> Run workflow -> 绿色按钮
#
# 粘贴前确认浏览器翻译插件是关闭状态。
# 本文件中文说明全是 # 注释，整段复制不影响运行。
# =============================================================================

name: fetch-prores-ckpt

# Purpose: this machine cannot reach Google Drive (TCP-level block, verified by
# connecting to the real IPs). GitHub runners run outside the firewall, so let a
# runner download the Drive file, strip the optimizer state, split into chunks,
# and publish the chunks as Release assets.

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive file id (default is the ProRes ViT-L checkpoint)"
        required: false
        default: "1P-MGgYtXJR214rBCD_LNZYrfQwDbSWGJ"
      part_mb:
        description: "chunk size in MB (GitHub allows 2GB per Release asset)"
        required: false
        default: "700"

permissions:
  contents: write   # a fresh repo token is read-only by default; Release needs write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install gdown
        run: pip install --quiet --upgrade gdown

      - name: Download from Google Drive
        run: |
          FID="${{ inputs.file_id }}"
          echo "gdown version:"; gdown --version || true
          # NOTE: recent gdown removed --id; the file id is a positional argument now.
          ok=0
          for i in 1 2 3; do
            echo "=== gdown attempt $i ==="
            if gdown "$FID" -O ckpt_raw.pth --continue --retries 5; then
              ok=1
              break
            fi
            sleep 10
          done
          SIZE=0
          if [ -f ckpt_raw.pth ]; then SIZE=$(stat -c%s ckpt_raw.pth); fi
          echo "after gdown: ok=$ok size=$SIZE"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "=== fallback: direct usercontent link ==="
            rm -f ckpt_alt.pth
            curl -L -sS --retry 5 --retry-delay 10 --retry-all-errors \
              "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" \
              -o ckpt_alt.pth -w "http=%{http_code}\n" || true
            if [ -f ckpt_alt.pth ]; then
              ASIZE=$(stat -c%s ckpt_alt.pth)
              echo "fallback size=$ASIZE"
              if [ "$ASIZE" -gt 100000000 ]; then
                mv ckpt_alt.pth ckpt_raw.pth
                SIZE=$ASIZE
              else
                echo "fallback head:"; head -c 400 ckpt_alt.pth; echo
              fi
            fi
          fi

          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::both gdown and direct link failed, final size=$SIZE. See the log above for the exact error."
            exit 1
          fi
          MD5=$(md5sum ckpt_raw.pth | awk '{print $1}')
          echo "SIZE_BYTES=$SIZE" >> "$GITHUB_ENV"
          echo "RAW_MD5=$MD5" >> "$GITHUB_ENV"
          echo "downloaded $SIZE bytes, md5=$MD5"

      - name: Slim checkpoint to model weights only
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu || true
          cat > slim.py <<'PY'
          import torch
          try:
              ck = torch.load('ckpt_raw.pth', map_location='cpu')
          except Exception as e:
              print('load failed:', e)
              raise SystemExit(0)
          print('top-level type:', type(ck).__name__)
          if isinstance(ck, dict):
              for k, v in ck.items():
                  if isinstance(v, dict):
                      print('  key:', k, '-> dict with', len(v), 'entries')
                  elif isinstance(v, (int, float, str)):
                      print('  key:', k, '->', v)
                  else:
                      print('  key:', k, '->', type(v).__name__)
          sd = None
          if isinstance(ck, dict):
              for key in ('model', 'state_dict', 'model_state_dict'):
                  if key in ck and isinstance(ck[key], dict):
                      sd = ck[key]
                      print('selected key:', key, 'tensors:', len(sd))
                      break
              if sd is None and ck and all(torch.is_tensor(v) for v in ck.values()):
                  sd = ck
                  print('checkpoint is already a raw state_dict')
          if sd is None:
              print('no model weights found, will keep the original file')
              raise SystemExit(0)
          total = sum(t.numel() * t.element_size() for t in sd.values() if torch.is_tensor(t))
          print('model-only payload: %.2f GB' % (total / 1e9))
          torch.save({'model': sd}, 'ckpt_model_only.pth')
          PY
          python slim.py || true
          ls -lh ckpt_raw.pth ckpt_model_only.pth 2>/dev/null || true

      - name: Pick the smaller usable file
        run: |
          SRC=ckpt_raw.pth
          if [ -f ckpt_model_only.pth ] && [ "$(stat -c%s ckpt_model_only.pth)" -gt 100000000 ]; then
            SRC=ckpt_model_only.pth
            echo "using slimmed model-only checkpoint"
          else
            echo "using the original full checkpoint"
          fi
          cp "$SRC" final.pth
          ls -lh final.pth
          echo "FINAL_BYTES=$(stat -c%s final.pth)" >> "$GITHUB_ENV"
          echo "FINAL_SRC=$SRC" >> "$GITHUB_ENV"

      - name: Verify final file is a torch archive
        run: |
          python -c "import zipfile,sys; ok=zipfile.is_zipfile('final.pth'); print('is_zipfile',ok); sys.exit(0 if ok else 1)"

      - name: Split into chunks
        run: |
          split -b "${{ inputs.part_mb }}M" -d -a 2 final.pth ckpt.pth.part
          ls -lh ckpt.pth.part*
          md5sum final.pth ckpt.pth.part* | tee parts_md5.txt

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ckpt-${{ github.run_number }}
          name: ProRes checkpoint run ${{ github.run_number }}
          body: |
            source file : ${{ env.FINAL_SRC }}
            final size  : ${{ env.FINAL_BYTES }} bytes
            raw md5     : ${{ env.RAW_MD5 }}
            merge       : cat ckpt.pth.part* > checkpoint-49.pth
            note        : if source file says ckpt_model_only.pth, this archive holds
                          {"model": state_dict} only, which is exactly what the
                          official demo scripts load via checkpoint['model'].
          files: |
            ckpt.pth.part*
            parts_md5.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# =============================================================================
# 跑完之后
#
#   新的 Release（ckpt-3）里应该是 2 个分卷、合计约 1.4 GB，
#   而不是上一轮的 7 个、4.45 GB。Release 页面会写
#   "source file : ckpt_model_only.pth"，那就对了。
#
#   直连慢就拼加速前缀（实测可用）：
#       https://ghfast.top/ + 原来的完整链接
#
#   分卷全部丢进：
#       E:\lunwen\图像复原\11_统一复原专题\03_代码\ProRes-main\ProRes\_ckpt_parts\
#   然后 cd ProRes && python join_ckpt.py
#
# 日志里重点看这三行
#   "downloaded NNN bytes"            下载成功，NNN 应在 4.4e9 量级
#   "model-only payload: X.XX GB"     瘦身成功，应在 1.4 左右
#   "using slimmed model-only checkpoint"
#
#   若出现 "using the original full checkpoint"，说明结构没识别出来，
#   会退回完整文件（仍然可用，只是要下 4.45 GB）。
# =============================================================================
